schema:
  - ../graphql/**/*.gql

exec:
  package: graph
  layout: single-file
  filename: graph/generated.go

model:
  filename: graph/graphmodel/models_gen.go
  package: graphmodel

resolver:
  dir: controller
  package: controller
  layout: follow-schema
  filename_template: '{name}.resolvers.go'

call_argument_directives_with_null: true

autobind:
#  - "github.com/ddd-todo/project-backend/graph/model"

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  UUID:
    model:
      - github.com/99designs/gqlgen/graphql.UUID
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
  Date:
    model:
      - github.com/ddd-todo/project-backend/graph/graphtype.Date
  DateTime:
    model:
      - github.com/ddd-todo/project-backend/graph/graphtype.DateTime
